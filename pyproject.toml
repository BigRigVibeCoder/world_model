[tool.pytest.ini_options]
# GOV-002 §18: Fail-fast cascade order
# GOV-002 §25: Marker configuration
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Pure unit tests — no I/O, no network, no disk (GOV-002 §4)",
    "property: Property-based tests via Hypothesis (GOV-002 §5)",
    "integration: Multi-component interaction tests (GOV-002 §8)",
    "contract: API/codec contract verification tests (GOV-002 §9)",
    "e2e: Full system end-to-end tests (GOV-002 §11)",
    "performance: Benchmark and latency budget tests (GOV-002 §13)",
    "slow: Tests taking > 1 second",
    "safety: Safety-critical path tests requiring MC/DC coverage",
    "quarantine: Flaky tests under investigation (GOV-002 §22)",
]

[tool.coverage.run]
source = ["biosphere"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# GOV-003 §12.1: Progressive adoption towards select = ["ALL"]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "COM", "C4", "PIE", "PT", "SIM", "PLR", "RUF", "TCH", "TID", "ICN", "RET", "RSE", "FLY", "PERF", "FURB", "LOG"]
# Progressive suppressions — revisit each sprint
ignore = [
    "RUF002",   # Unicode chars (×) in docstrings are intentional
    "RUF003",   # Unicode chars (–, ×) in comments are mathematical notation
    "RUF012",   # Textual BINDINGS pattern uses mutable class default
    "TC001",    # Application imports in type-checking — API clarity
    "TC002",    # Third-party imports in type-checking — numpy needed at runtime
    "TC003",    # Stdlib imports in type-checking — Path used at runtime
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",  # Magic numbers are expected in test assertions
    "PT006",    # pytest.mark.parametrize accepts strings
    "E501",     # Docstrings may exceed 88 chars for readability
    "RUF059",   # Unused unpacked variables in test assertions
]

# GOV-003 §6.5: Mutation testing config (DEF-001-09)
[tool.mutmut]
paths_to_mutate = "biosphere/"
tests_dir = "tests/"
runner = "python -m pytest -x --tb=short"

# GOV-003 §6.5: Cyclomatic complexity (DEF-001-06)
# Run: radon cc biosphere/ -a -nc
# Target: No function > CC 10

# GOV-003 §6.5: Security scanning (DEF-001-06)
# Run: bandit -r biosphere/ -c pyproject.toml
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert used for correctness proofs (GOV-003 §2 Rule 5)

