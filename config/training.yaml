# MaskablePPO Training Hyperparameters
# Refs: BLU-002 §3, EVO-002 §4.2

algorithm: MaskablePPO
total_timesteps: 100000

# Policy network
policy: MultiInputPolicy
policy_kwargs:
  net_arch: [64, 64]

# PPO hyperparameters
learning_rate: 0.0003
n_steps: 256
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# Checkpointing
checkpoint_interval: 10000
checkpoint_dir: checkpoints/
